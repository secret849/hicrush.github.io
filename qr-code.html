<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #FBF3EE;
    font-family: 'Jost', sans-serif;
    color: #3B2E2A;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: #FFFDF9;
    border: 1px solid #ECDDD3;
    border-radius: 8px;
    padding: 36px 32px;
    box-shadow: 0 24px 50px -28px rgba(59,46,42,0.3);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .sub {
    font-size: 13px;
    color: #8A6F63;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: #8A6F63;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #E3CFC6;
    border-radius: 5px;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    background: #FFFEFC;
    color: #3B2E2A;
    margin-bottom: 18px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #C7828F;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: #C7828F;
    color: #FFFDF9;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  button:hover { background: #B96F7D; }

  #result {
    display: none;
    margin-top: 30px;
    text-align: center;
  }

  #result.visible { display: block; }

  #qr-card {
    display: inline-block;
    background: #FFFFFF;
    border: 1px solid #ECDDD3;
    border-radius: 8px;
    padding: 24px 24px 18px;
  }

  #qr-box {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #qr-caption {
    margin-top: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: #4A3A34;
  }

  .print-btn {
    margin-top: 16px;
    background: #8A9A7E;
  }

  .print-btn:hover { background: #79886E; }

  @media print {
    body { background: #fff; padding: 0; }
    .panel > h1, .panel > .sub, .panel > label, .panel > input, .panel > button:not(.print-btn) {
      display: none;
    }
    .panel {
      box-shadow: none;
      border: none;
      padding: 0;
    }
    .print-btn { display: none; }
    #qr-card { border: none; }
  }

</style>
</head>
<body>

<div class="panel">
  <h1>Make it printable</h1>
  <p class="sub">Paste the link where you hosted your letter page, then generate the code. Print it, and she just has to scan it.</p>

  <label for="url">Your link</label>
  <input type="text" id="url" placeholder="https://your-page.netlify.app">

  <label for="caption">Caption under the code (optional)</label>
  <input type="text" id="caption" placeholder="scan me" value="scan me">

  <button id="generate">Generate QR code</button>

  <div id="result">
    <div id="qr-card">
      <div id="qr-box"></div>
      <div id="qr-caption"></div>
    </div>
    <br>
    <button class="print-btn" id="print">Print this code</button>
  </div>
</div>

<script>
  const generateBtn = document.getElementById('generate');
  const printBtn = document.getElementById('print');
  const urlInput = document.getElementById('url');
  const captionInput = document.getElementById('caption');
  const result = document.getElementById('result');
  const qrBox = document.getElementById('qr-box');
  const qrCaption = document.getElementById('qr-caption');

  generateBtn.addEventListener('click', () => {
    const link = urlInput.value.trim();
    if (!link) {
      urlInput.style.borderColor = '#C7828F';
      urlInput.focus();
      return;
    }

    qrBox.innerHTML = '';
    new QRCode(qrBox, {
      text: link,
      width: 220,
      height: 220,
      colorDark: '#3B2E2A',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H
    });

    qrCaption.textContent = captionInput.value.trim();
    result.classList.add('visible');
  });

  printBtn.addEventListener('click', () => {
    window.print();
  });
</script>

</body>
</html>
